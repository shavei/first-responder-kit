name: Release APK

# Builds the release APK and attaches it to a GitHub Release, so the README can
# link to a stable download URL:
#   https://github.com/shavei/first-responder-kit/releases/latest/download/first-responder-kit.apk
#
# Two ways to cut a release:
#   - push a tag:  git tag v1.0.0 && git push origin v1.0.0
#   - Actions tab → Run workflow, pick the branch to release from and type the
#     version. The tag does not have to exist; it is created at the commit that
#     was built. This is the path to use when you cannot push tags directly.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v1.0.0) — created if it does not exist"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # For a tag push this is the tag; for a manual run it is the ref chosen in
      # the Actions tab. Either way the release is built from the checked-out commit.
      - name: Check out the commit to release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install the Android SDK packages the build needs
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      # The tag drives versionName so a v1.1.0 APK does not report itself as 1.0.
      - name: Resolve the version from the tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Optional: set the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and
      # KEY_PASSWORD repository secrets to sign with a real upload key. Without
      # them the build falls back to the debug key (see app/build.gradle.kts),
      # which is installable but changes signature between runners — so users
      # have to uninstall before upgrading.
      - name: Write the signing config, if a keystore secret is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret set — release build will use the debug key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "Signing with the configured release key."

      - name: Run the unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build the release APK
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ github.run_number }}"

      - name: Remove the keystore from the workspace
        if: always()
        run: rm -f release.jks keystore.properties

      # A fixed asset name is what makes the /releases/latest/download/ URL stable.
      - name: Stage the APK under a stable name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/first-responder-kit.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/first-responder-kit.apk --clobber
          else
            # --target creates the tag at the commit that was just built when the
            # tag does not already exist, so a manual run needs no tag push.
            gh release create "$TAG" dist/first-responder-kit.apk \
              --target "$GITHUB_SHA" \
              --title "First Responder Kit ${{ steps.version.outputs.name }}" \
              --generate-notes
          fi
