name: Release APK

# Builds the release APK and attaches it to a GitHub Release, so the README can
# link to a stable download URL:
#   https://github.com/shavei/first-responder-kit/releases/latest/download/first-responder-kit.apk
#
# Trigger it by pushing a tag:  git tag v1.0.0 && git push origin v1.0.0
# or from the Actions tab (Run workflow) with an existing tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install the Android SDK packages the build needs
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      # The tag drives versionName so a v1.1.0 APK does not report itself as 1.0.
      - name: Resolve the version from the tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      # A published APK must be signed with a stable key. The debug key AGP falls
      # back to is generated fresh on each runner, so consecutive releases carry
      # different signatures and Android refuses to install one over the other —
      # it treats a changed signature as a different app and blocks the upgrade.
      # Rather than publish an APK nobody can upgrade to, fail here and say so.
      - name: Write the signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Run ./tools/make-release-key.sh — it creates the key and prints the"
            echo "four values to paste under Settings → Secrets and variables → Actions."
            echo "Releases are not published unsigned: an APK signed with the runner's"
            echo "throwaway debug key cannot be installed over any other build."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "Signing with the configured release key."

      # The tests are not run again here. They run on every pull request and on
      # everything that lands on main (see tests.yml), and a tag is cut from a
      # commit on main — so by the time a tag exists, its commit has already been
      # tested on this same toolchain. Running them a second time would only add
      # minutes to a release and teach everyone to skim past a step that always
      # passes.
      - name: Build the release APK
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ github.run_number }}"

      - name: Remove the keystore from the workspace
        if: always()
        run: rm -f release.jks keystore.properties

      # A fixed asset name is what makes the /releases/latest/download/ URL stable.
      - name: Stage the APK under a stable name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/first-responder-kit.apk

      # The signing config is easy to get wrong quietly, and the failure only
      # shows up on someone's phone days later, so check the artifact itself.
      - name: Check the APK is signed with the release key
        id: signing
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)"
          "$APKSIGNER" verify --print-certs --verbose dist/first-responder-kit.apk | tee signing.txt
          if grep -q 'CN=Android Debug' signing.txt; then
            echo "::error::APK is signed with the debug key — refusing to publish it."
            exit 1
          fi
          # apksigner labels the line differently between versions — "Signer #1
          # certificate SHA-256 digest:" on older ones, "V3.0 Signer: certificate
          # SHA-256 digest:" on 35.0.0 — so cut everything up to the last colon
          # rather than counting fields. Naming the certificate digest explicitly
          # also keeps the public key's digest, printed a few lines below it,
          # from being picked up if the order ever changes. The bare hex is then
          # colon-grouped and upper-cased to read the same as `keytool -printcert`
          # and as the certificate Android itself shows.
          FINGERPRINT="$(
            grep -m1 -i 'certificate SHA-256 digest' signing.txt |
              sed 's/.*digest: *//' |
              tr -d ' ' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//'
          )"
          [ -n "$FINGERPRINT" ] || { echo "::error::Could not read the certificate digest."; exit 1; }
          SHA256="$(sha256sum dist/first-responder-kit.apk | cut -d' ' -f1)"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      # Publishing the two hashes lets anyone confirm the download is the build
      # this workflow made, and that it carries the same key as the last one.
      - name: Write the release notes
        env:
          FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
          SHA256: ${{ steps.signing.outputs.sha256 }}
        run: |
          cat > notes.md <<EOF
          Android 8.0 (API 26) or newer. This is a sideload, not a Play Store install, so
          Android asks for confirmation twice. Neither prompt means anything was found in
          the app.

          1. Open the downloaded file. At **"…is not allowed to install unknown apps"**,
             tap **Settings**, allow it for whichever app you opened the file from, and
             come back. Android asks this once per app, per device.
          2. At **"App blocked to protect your device"**, tap **More details** →
             **Install anyway**. The dialog shows only **Got it** until you expand it, so
             the install button is easy to miss. Play Protect is judging the signing key's
             reputation here — which a sideloaded app has no way to build — not the build
             itself.
          3. If there is no **Install anyway**, Play Protect is set to block rather than
             warn. **Play Store → profile → Play Protect → ⚙ → Scan apps with Play
             Protect** off, install, then **back on**.

          The two hashes below identify this exact build if you want to check it first.

          If you have a build from **v1.6.0 or earlier** installed, uninstall it first.
          Those were signed with a throwaway key that changed on every build, which is
          why installing over them failed. From this release on the key is stable and
          upgrades work normally.

          | | |
          |---|---|
          | APK SHA-256 | \`$SHA256\` |
          | Signing certificate SHA-256 | \`$FINGERPRINT\` |
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/first-responder-kit.apk --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/first-responder-kit.apk \
              --title "First Responder Kit ${{ steps.version.outputs.name }}" \
              --notes-file notes.md --generate-notes
          fi
