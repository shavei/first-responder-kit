name: Tests

# Runs the unit tests on every pull request, and on anything that lands on main.
#
# Nothing here builds, signs or publishes an APK — that is entirely the release
# workflow's job and it still happens only when a version tag is pushed. This
# workflow exists so that a defect is found while the change is still a pull
# request, rather than after a tag has been cut and published under a version
# number that then has to be withdrawn.
#
# The setup steps deliberately mirror `release.yml` step for step, including the
# Gradle cache key, so that a green run here means the same thing on the same
# toolchain as the run that will eventually build the APK.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes the run already in flight for it pointless.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The same key as the release workflow, so the two share one cache rather
      # than each warming its own.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install the Android SDK packages the build needs
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Run the unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # The metronome tests assert millisecond tolerances, so a failure here is
      # worth being able to read rather than re-run blind: the HTML report says
      # which beat was how far out of place.
      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14
